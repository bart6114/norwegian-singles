name: Live site health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 utils/check-live.py
