on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true

      - name: Check guide arithmetic and source links
        run: python3 utils/check-guide.py

      - name: Render all formats
        run: quarto render sections --to all

      - name: Check rendered links and discovery files
        run: python3 utils/check-guide.py --rendered

      - name: Publish checked output
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: sections
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
